[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "returns-prediction-api"
version = "0.1.0"
description = "Production package and FastAPI service for return prediction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "mlflow>=2.14,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
train-returns-model = "returns_app.train:main"

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
dvc = ["dvc[s3]>=3.50,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
returns_app = ["static/*"]
